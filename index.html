<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VANTRA Mission Control</title>
<style>
:root{
  --bg:#070714; --surface:#0e0e20; --surface2:#151530; --border:rgba(150,120,255,.14);
  --purple:#9d7cff; --purple-deep:#5b3df5; --gold:#d4af37; --gold-soft:#f0d88c;
  --green:#4ade80; --red:#f87171; --amber:#fbbf24; --text:#f2f0fa; --dim:#8a86a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
/* LOGIN */
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,#151538 0%,var(--bg) 60%);z-index:99}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--purple-deep),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;box-shadow:0 0 30px rgba(157,124,255,.4)}
#login h1{font-size:19px;font-weight:700;letter-spacing:.5px}
#login h1 span{color:var(--gold)}
#login p{font-size:12px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#pin{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-size:18px;width:250px;text-align:center;outline:none;letter-spacing:6px}
#pin:focus{border-color:var(--purple)}
#loginBtn{background:linear-gradient(135deg,var(--purple-deep),var(--purple));border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;padding:13px 0;width:250px;cursor:pointer}
#loginErr{color:var(--red);font-size:13px;min-height:16px}
/* SHELL */
header{position:sticky;top:0;z-index:10;background:rgba(7,7,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:15px;letter-spacing:.5px}.brand em{color:var(--gold);font-style:normal}
.hbtns{display:flex;gap:8px}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer}
.hbtn.on{border-color:var(--purple);color:var(--purple)}
nav.tabs{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto}
.tab{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:20px;padding:7px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--purple);color:var(--purple);background:rgba(157,124,255,.08)}
main{padding:10px 16px 90px;max-width:1100px;margin:0 auto}
/* QUICK CAPTURE */
#capture{display:flex;gap:8px;margin:10px 0 14px}
#capIn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:15px;outline:none}
#capIn:focus{border-color:var(--purple)}
#capBtn{background:linear-gradient(135deg,var(--gold),var(--gold-soft));border:none;border-radius:12px;color:#1a1500;font-weight:800;font-size:14px;padding:0 20px;cursor:pointer}
.capExtra{display:flex;gap:8px;margin:-8px 0 14px}
.capExtra select,.capExtra input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px;font-size:13px;outline:none}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat.s-approval b{color:var(--gold)}.stat.s-blocked b{color:var(--red)}.stat.s-active b{color:var(--green)}.stat.s-review b{color:var(--amber)}
/* SECTIONS */
.sec{margin-bottom:16px}
.sec h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin:0 0 8px 4px}
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .t{font-size:14.5px;font-weight:600;line-height:1.35}
.card .m{display:flex;gap:10px;margin-top:7px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.5px}
.p-urgent{background:rgba(248,113,113,.15);color:var(--red)}
.p-high{background:rgba(251,191,36,.15);color:var(--amber)}
.p-normal{background:rgba(157,124,255,.14);color:var(--purple)}
.p-low{background:rgba(138,134,168,.15);color:var(--dim)}
.p-app{background:rgba(212,175,55,.18);color:var(--gold)}
.p-green{background:rgba(74,222,128,.15);color:var(--green)}
.card.st-COMPLETED{opacity:.62}.card.st-CANCELLED{opacity:.45}
/* BOARD */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:78vw;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.board .col{scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:150px}
.board .col h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px;display:flex;justify-content:space-between}
.board .col h3 i{font-style:normal;color:var(--dim)}
.board .card{margin-bottom:8px}
@media(min-width:820px){
  .board{grid-auto-flow:initial;grid-template-columns:repeat(7,1fr);grid-auto-columns:auto;overflow:visible}
  .board .col{min-height:200px}
}
/* TASK DETAIL */
#drawer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,4,12,.7)}
@media(min-width:700px){#drawer{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:86vh;overflow-y:auto;padding:18px 18px 26px}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet .close{float:right;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.sheet h3{font-size:17px;font-weight:700;padding-right:30px;line-height:1.35}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.desc{font-size:13.5px;color:#c9c5de;line-height:1.5;margin:8px 0}
.log{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.log h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.le{font-size:12.5px;padding:7px 0;border-bottom:1px solid rgba(150,120,255,.06)}
.le b{color:var(--gold-soft)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.abtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;font-weight:600}
.abtn.primary{background:linear-gradient(135deg,var(--purple-deep),var(--purple));border:none;color:#fff}
.abtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));border:none;color:#1a1500}
.abtn.danger{border-color:rgba(248,113,113,.4);color:var(--red)}
.abtn.green{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.4);color:var(--green)}
#noteIn,#assignIn{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:13px;margin-top:8px;outline:none}
/* APPROVALS / AGENTS */
.apcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.apcard .acts{margin-top:10px}
.agent{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.agent .n{font-weight:700;font-size:13.5px}
.agent .s{font-size:11px;color:var(--dim);margin-top:2px}
.v-ok{color:var(--green);font-weight:700;font-size:11px}.v-no{color:var(--amber);font-weight:700;font-size:11px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(7,7,20,.95);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;box-shadow:0 0 8px var(--green)}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--purple);color:var(--text);border-radius:12px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="login">
  <div class="logo">V</div>
  <h1>VANTRA <span>Mission Control</span></h1>
  <p>Executive Operations</p>
  <input id="pin" type="password" placeholder="PIN" autocomplete="off">
  <button id="loginBtn">UNLOCK</button>
  <div id="loginErr"></div>
</div>

<div id="shell" class="hidden">
<header>
  <div class="brand">VANTRA <em>MISSION CONTROL</em></div>
  <div class="hbtns"><button class="hbtn on" id="vHome">Home</button><button class="hbtn" id="vBoard">Board</button><button class="hbtn" id="vAgents">Agents</button></div>
</header>
<nav class="tabs" id="filters">
  <button class="tab on" data-f="all">All</button><button class="tab" data-f="ACTIVE">Active</button><button class="tab" data-f="READY">Ready</button><button class="tab" data-f="BLOCKED">Blocked</button><button class="tab" data-f="REVIEW">Review</button><button class="tab" data-f="COMPLETED">Done</button>
</nav>
<main>
  <div id="home">
    <div id="capture"><input id="capIn" placeholder="New task — type and go"><button id="capBtn">+ ADD</button></div>
    <div class="capExtra">
      <select id="capPriority"><option value="">Priority…</option><option>urgent</option><option>high</option><option>normal</option><option>low</option></select>
      <input id="capProject" placeholder="Project (optional)">
      <select id="capApproval"><option value="no">No approval needed</option><option value="yes">Requires my approval</option></select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="sec" id="approvalsSec"><h2>Pending Approvals</h2><div id="approvals"></div></div>
    <div class="sec"><h2 id="listTitle">Tasks</h2><div id="tasks"></div></div>
  </div>
  <div id="boardView" class="hidden"><div class="board" id="board"></div></div>
  <div id="agentsView" class="hidden"><div class="sec" style="margin-top:12px"><h2>Agent Directory — Operational Truth</h2><div id="roster"></div></div><div class="sec"><h2>Live Telemetry (AgentStatus)</h2><div id="liveAgents"></div></div></div>
</main>
<footer><span><span class="dot"></span><span id="sync">synced</span></span><span id="whoami"></span></footer>
</div>

<div id="drawer" class="hidden"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const APIURL = "https://base44.app/api/apps/6a9224f8c29c628aa348d1ac/functions/missionControlApi"; // absolute: app hosted off-platform (CSP fix)
let token = localStorage.getItem('mc_token') || '';
let board = null; let view='home'; let filter='all'; let selected=null;
const $ = id => document.getElementById(id);

function devLabel(){const ua=navigator.userAgent;if(/iPhone|Android.*Mobile/i.test(ua))return 'phone';if(/iPad|Tablet/i.test(ua))return 'tablet';if(/Windows/i.test(ua))return 'windows-pc';if(/Macintosh/i.test(ua))return 'mac';return 'browser';}
async function api(op, extra={}){
  const res = await fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({op,...extra})});
  const d = await res.json();
  if(!d.ok && res.status===401){localStorage.removeItem('mc_token');token='';$('login').classList.remove('hidden');$('shell').classList.add('hidden');throw new Error('auth');}
  if(!d.ok) throw new Error(d.error||'op failed');
  return d;
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stateColor(s){return s==='COMPLETED'?'var(--green)':s==='BLOCKED'?'var(--red)':s==='REVIEW'?'var(--amber)':s==='ACTIVE'?'#6ee7a0':'var(--purple)';}

async function login(){
  const pin=$('pin').value.trim(); if(!pin) return;
  $('loginErr').textContent='';
  try{
    const res=await fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'login',pin,deviceLabel:devLabel()})});
    const d=await res.json();
    if(!d.ok){$('loginErr').textContent=d.error;return;}
    token=d.token; localStorage.setItem('mc_token',token);
    $('login').classList.add('hidden'); $('shell').classList.remove('hidden');
    refresh();
  }catch(e){$('loginErr').textContent='Connection error';}
}
async function refresh(){
  try{
    board=await api('board');
    $('sync').textContent='synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    $('whoami').textContent='BOSS · '+devLabel();
    renderStats(); renderApprovals(); renderTasks(); renderBoard(); renderAgents();
  }catch(e){ if(String(e.message)!=='auth') toast(e.message); }
}
function renderStats(){
  const s=board.stats;
  $('stats').innerHTML=
   \`<div class="stat s-active"><b>\${s.active}</b><span>Active</span></div>
    <div class="stat"><b>\${s.ready}</b><span>Ready</span></div>
    <div class="stat s-blocked"><b>\${s.blocked+s.waiting}</b><span>Block/Wait</span></div>
    <div class="stat s-approval"><b>\${s.pendingApprovals}</b><span>Approvals</span></div>\`;
}
function renderApprovals(){
  const ap=board.approvals||[];
  $('approvalsSec').style.display=ap.length?'block':'none';
  $('approvals').innerHTML=ap.map(a=>\`
    <div class="apcard"><div class="t" style="font-size:14px">\${esc(a.description||a.type)}</div>
    <div class="m" style="margin-top:6px;font-size:11.5px;color:var(--dim)">requested by \${esc(a.requestedBy)} · \${new Date(a.requestedAt||'').toLocaleString()}</div>
    <div class="acts">
      <button class="abtn gold" onclick="decide('\${a.id}','approve')">Approve</button>
      <button class="abtn danger" onclick="decide('\${a.id}','deny')">Deny</button>
      <button class="abtn" onclick="openTask('\${a.relatedTaskId}')">Task</button>
    </div></div>\`).join('');
}
function taskCard(t){
  return \`<div class="card st-\${t.state}" onclick="openTask('\${t.taskId}')">
    <div class="t">\${esc(t.title)}</div>
    <div class="m">
      <span class="pill p-\${t.priority||'normal'}">\${esc((t.priority||'normal').toUpperCase())}</span>
      <span class="pill" style="border:1px solid \${stateColor(t.state)};color:\${stateColor(t.state)}">\${esc(t.state)}</span>
      \${t.requiresApproval==='yes'?'<span class="pill p-app">APPROVAL</span>':''}
      \${t.assignedAgent?'<span>· '+esc(t.assignedAgent)+'</span>':''}
      \${t.project?'<span>· '+esc(t.project)+'</span>':''}
    </div></div>\`;
}
function renderTasks(){
  let ts=board.tasks;
  if(filter==='all') ts=ts.filter(t=>t.state!=='COMPLETED'&&t.state!=='CANCELLED');
  else ts=ts.filter(t=>t.state===filter);
  $('listTitle').textContent=filter==='all'?'Open Tasks':filter;
  $('tasks').innerHTML=ts.length?ts.map(taskCard).join(''):'<div style="color:var(--dim);font-size:13px;padding:8px 4px">No tasks here. Capture one above.</div>';
}
const COLS=['BACKLOG','READY','ACTIVE','WAITING','BLOCKED','REVIEW','COMPLETED'];
function renderBoard(){
  const cols=filter==='all'?COLS:COLS.filter(c=>c===filter);
  $('board').innerHTML=cols.map(c=>{
    const ts=board.tasks.filter(t=>t.state===c);
    return \`<div class="col"><h3>\${c}<i>\${ts.length}</i></h3>\${ts.map(taskCard).join('')||'<div style="color:var(--dim);font-size:12px">—</div>'}</div>\`;
  }).join('');
}
async function renderAgents(){
  try{
    const d=await api('agents');
    $('roster').innerHTML=(d.roster||[]).map(r=>{
      const ok=r.operationalTruth.includes('VERIFIED WORKING');
      return \`<div class="agent"><div><div class="n">\${esc(r.name)}</div><div class="s">\${esc(r.truthSource)}</div></div><div class="\${ok?'v-ok':'v-no'}">\${esc(r.operationalTruth)}</div></div>\`;
    }).join('');
    $('liveAgents').innerHTML=(d.agents||[]).map(a=>\`<div class="agent"><div><div class="n">\${esc(a.agentName)}</div><div class="s">heartbeat \${esc(a.lastHeartbeat||'none')}</div></div><div class="pill">\${esc(a.status)}</div></div>\`).join('')||'<div style="color:var(--dim);font-size:12px">No live telemetry reported yet.</div>';
  }catch(e){}
}
async function openTask(taskId){
  try{
    const d=await api('task',{taskId});
    selected=d.task;
    const t=selected;
    const aps=d.approvals||[];
    let acts='';
    if(t.state==='BACKLOG') acts+='<button class="abtn primary" onclick="move(\\'READY\\',\\'ready\\')">→ Ready</button>';
    if(t.state==='READY') acts+='<button class="abtn primary" onclick="move(\\'ACTIVE\\',\\'started by Boss\\')">Start</button>';
    if(t.state==='ACTIVE') acts+='<button class="abtn" onclick="move(\\'BLOCKED\\',\\'blocked by Boss\\')">Block</button><button class="abtn" onclick="move(\\'REVIEW\\',\\'ready for review\\')">→ Review</button>';
    if(t.state==='BLOCKED'||t.state==='WAITING') acts+='<button class="abtn green" onclick="move(\\'ACTIVE\\',\\'unblocked by Boss\\')">Unblock</button>';
    if(t.state==='REVIEW') acts+='<button class="abtn gold" onclick="complete()">Complete ✓</button>';
    if(t.state!=='COMPLETED'&&t.state!=='CANCELLED') acts+='<button class="abtn danger" onclick="move(\\'CANCELLED\\',\\'cancelled by Boss\\')">Cancel</button>';
    const log=(t.activityLog||[]).map(e=>\`<div class="le"><b>\${esc(e.actor)}</b> · \${esc(e.kind)} · \${esc(String(e.text||'').substring(0,160))}<div style="color:var(--dim);font-size:10.5px">\${new Date(e.at).toLocaleString()}</div></div>\`).join('');
    const hist=(t.stateHistory||[]).map(h=>\`<div class="le" style="font-size:11.5px">\${esc(h.from||'(new)')} → <b>\${esc(h.to)}</b> by \${esc(h.actor)} · \${new Date(h.at).toLocaleString()}</div>\`).join('');
    $('sheet').innerHTML=\`
      <button class="close" onclick="closeDrawer()">✕</button>
      <h3>\${esc(t.title)}</h3>
      <div class="meta">
        <span class="pill" style="border:1px solid \${stateColor(t.state)};color:\${stateColor(t.state)}">\${esc(t.state)}</span>
        <span class="pill p-\${t.priority||'normal'}">\${esc((t.priority||'normal').toUpperCase())}</span>
        \${t.requiresApproval==='yes'?'<span class="pill p-app">APPROVAL REQUIRED</span>':''}
        <span class="pill p-normal">\${esc(t.createdBy)}</span>
        \${t.assignedAgent?'<span class="pill p-normal">→ '+esc(t.assignedAgent)+'</span>':''}
      </div>
      \${t.description?'<div class="desc">'+esc(t.description)+'</div>':''}
      \${t.errorSummary?'<div class="desc" style="color:var(--red)">⚠ '+esc(t.errorSummary)+'</div>':''}
      \${aps.length?'<div class="sec"><h2>Approvals</h2>'+aps.map(a=>'<div class="le">Approval: <b>'+esc(a.status)+'</b> · '+esc(new Date(a.decidedAt||a.requestedAt).toLocaleString())+'</div>').join('')+'</div>':''}
      <input id="noteIn" placeholder="Add note…"><button class="abtn" style="margin-top:8px" onclick="addNote()">Post Note</button>
      \${t.state==='READY'?'<input id="assignIn" placeholder="Assign to agent (e.g. LENOHERMES)">':''}
      <div class="acts">\${acts}</div>
      <div class="log"><h4>Activity</h4>\${log||'<div class="le">No activity yet.</div>'}</div>
      <div class="log"><h4>State History</h4>\${hist}</div>\`;
    $('drawer').classList.remove('hidden');
  }catch(e){toast(e.message);}
}
function closeDrawer(){$('drawer').classList.add('hidden');}
async function move(to,reason){try{await api('moveTask',{taskId:selected.taskId,to,reason});toast('→ '+to);closeDrawer();refresh();}catch(e){toast(e.message);}}
async function complete(){try{await api('complete',{taskId:selected.taskId,verified:true,note:'Boss verified from client'});toast('Completed ✓');closeDrawer();refresh();}catch(e){toast(e.message);}}
async function addNote(){const v=$('noteIn').value.trim();if(!v)return;try{await api('note',{taskId:selected.taskId,text:v});toast('Note added');openTask(selected.taskId);}catch(e){toast(e.message);}}
async function decide(id,decision){try{await api('decideApproval',{approvalId:id,decision,note:'decided from client'});toast(decision==='approve'?'Approved ✓':'Denied');refresh();}catch(e){toast(e.message);}}
async function createTask(){
  const title=$('capIn').value.trim(); if(!title) return;
  try{
    await api('createTask',{title,priority:$('capPriority').value||'normal',project:$('capProject').value.trim(),requiresApproval:$('capApproval').value});
    $('capIn').value='';$('capProject').value='';toast('Task captured');
    refresh();
  }catch(e){toast(e.message);}
}
/* wiring */
$('loginBtn').onclick=login;
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('capBtn').onclick=createTask;
$('capIn').addEventListener('keydown',e=>{if(e.key==='Enter')createTask();});
$('vHome').onclick=()=>{view='home';$('home').classList.remove('hidden');$('boardView').classList.add('hidden');$('agentsView').classList.add('hidden');$('vHome').classList.add('on');$('vBoard').classList.remove('on');$('vAgents').classList.remove('on');};
$('vBoard').onclick=()=>{view='board';$('home').classList.add('hidden');$('boardView').classList.remove('hidden');$('agentsView').classList.add('hidden');$('vBoard').classList.add('on');$('vHome').classList.remove('on');$('vAgents').classList.remove('on');};
$('vAgents').onclick=()=>{view='agents';$('home').classList.add('hidden');$('boardView').classList.add('hidden');$('agentsView').classList.remove('hidden');$('vAgents').classList.add('on');$('vHome').classList.remove('on');$('vBoard').classList.remove('on');renderAgents();};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;if(view==='board'){renderBoard();}else{renderTasks();}});
setInterval(()=>{if(token)refresh();},45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)refresh();});
/* boot */
if(token){fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({op:'board'})}).then(r=>{if(r.status===401){localStorage.removeItem('mc_token');token='';location.reload();}else if(r.ok){$('login').classList.add('hidden');$('shell').classList.remove('hidden');refresh();}}).catch(()=>{});}
</script>
</body>
</html>
