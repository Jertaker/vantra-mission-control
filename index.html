<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VANTRA Mission Control</title>
<style>
:root{
  --bg:#070714; --surface:#0e0e20; --surface2:#151530; --border:rgba(150,120,255,.14);
  --purple:#9d7cff; --purple-deep:#5b3df5; --gold:#d4af37; --gold-soft:#f0d88c;
  --green:#4ade80; --red:#f87171; --amber:#fbbf24; --text:#f2f0fa; --dim:#8a86a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
/* iOS zoom guard + safe areas (P2-7) */
input,select,textarea{font-size:16px}
/* LOGIN */
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,#151538 0%,var(--bg) 60%);z-index:99;padding:0 20px}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--purple-deep),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;box-shadow:0 0 30px rgba(157,124,255,.4)}
#login h1{font-size:19px;font-weight:700;letter-spacing:.5px;text-align:center}
#login h1 span{color:var(--gold)}
#login p{font-size:12px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#pin{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-size:18px;width:250px;text-align:center;outline:none;letter-spacing:6px}
#pin:focus{border-color:var(--purple)}
#loginBtn{background:linear-gradient(135deg,var(--purple-deep),var(--purple));border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;padding:13px 0;width:250px;cursor:pointer}
#loginBtn:disabled{opacity:.6}
#loginErr{color:var(--red);font-size:13px;min-height:18px;text-align:center;max-width:300px;line-height:1.45}
#loginErr .abtn{margin-left:4px}
/* SHELL */
header{position:sticky;top:0;z-index:10;background:rgba(7,7,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:.5px}.brand em{color:var(--gold);font-style:normal}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer}
.hbtn.on{border-color:var(--purple);color:var(--purple)}
.hbtn.warn{border-color:rgba(248,113,113,.4);color:var(--red)}
nav.tabs{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto}
.tab{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:20px;padding:7px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--purple);color:var(--purple);background:rgba(157,124,255,.08)}
main{padding:10px 16px 90px;max-width:1100px;margin:0 auto}
/* QUICK CAPTURE */
#capture{display:flex;gap:8px;margin:10px 0 14px}
#capIn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:16px;outline:none}
#capIn:focus{border-color:var(--purple)}
#capBtn{background:linear-gradient(135deg,var(--gold),var(--gold-soft));border:none;border-radius:12px;color:#1a1500;font-weight:800;font-size:14px;padding:0 20px;cursor:pointer}
#capBtn:disabled{opacity:.6}
.capExtra{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 14px}
.capExtra select,.capExtra input{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px;font-size:16px;outline:none}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.stat.s-approval b{color:var(--gold)}.stat.s-blocked b{color:var(--red)}.stat.s-active b{color:var(--green)}.stat.s-review b{color:var(--amber)}
/* SECTIONS */
.sec{margin-bottom:16px}
.sec h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin:0 0 8px 4px}
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card .t{font-size:14.5px;font-weight:600;line-height:1.35}
.card .m{margin-top:6px;font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:10px;letter-spacing:.5px;text-transform:uppercase}
.p-urgent{border-color:var(--red);color:var(--red)}.p-high{border-color:var(--amber);color:var(--amber)}
.p-app{border-color:var(--gold);color:var(--gold)}
.errline{color:var(--red);font-size:13px;padding:10px 4px;line-height:1.5}
/* BOARD */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:120px}
.col h3{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-bottom:8px;display:flex;justify-content:space-between}
.col h3 i{font-style:normal;color:var(--purple);font-weight:700}
/* APPROVALS / AGENTS */
.apcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.apcard .acts{margin-top:10px}
.agent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.agent .n{font-weight:700;font-size:13.5px}
.agent .s{font-size:11px;color:var(--dim);margin-top:2px}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcard .rn{font-weight:800;font-size:16px;line-height:1.25;color:#fff;word-break:break-word}
.rcard .rt{font-size:15px;line-height:1.35;color:#e6e0ff;margin-top:4px;white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;cursor:pointer;padding:4px 0;min-height:22px}
.rcard .rt.empty{color:#b9a8ff;font-style:italic}
.rcard .rt .pen{font-size:13px;opacity:.85;margin-left:6px}
.rcard .tag{display:inline-block;font-size:12px;font-weight:700;color:#d8ccff;background:rgba(124,92,255,.22);border:1px solid rgba(124,92,255,.5);border-radius:999px;padding:3px 10px;margin-top:6px}
.rcard .tag.grokbot{color:#c9f7da;background:rgba(40,200,120,.18);border-color:rgba(40,200,120,.5)}
.rcard .why{font-size:12.5px;color:#cfc8e8;margin-top:8px;line-height:1.4;word-break:break-word}
.rcard .editrow{display:flex;gap:8px;margin-top:6px}
.rcard .editrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0e0b1c;color:#fff}
.rcard .editrow button{font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:#7c5cff;color:#fff}
.rcard .editrow button.cancel{background:#2a2540;color:#d8ccff}
.v-ok{color:var(--green);font-weight:700;font-size:11px;text-align:right}.v-no{color:var(--amber);font-weight:700;font-size:11px;text-align:right}
/* ---------- LIVE OFFICE (animated walking workers, Oct 14 v6) ---------- */
.floor-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}
.floor-head span{font-size:11px;color:#00ffff;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 8px rgba(0,255,255,.45)}
.floor-legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px;font-size:10px;color:#b9b3d0}
.floor-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.lo{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1px solid rgba(138,43,226,.6);box-shadow:0 0 22px rgba(138,43,226,.35);background:#05050a url('office_bg.jpg?v=92') center/cover no-repeat;touch-action:manipulation}
.lo::before{content:'';position:absolute;inset:0;background:rgba(5,5,12,.30);pointer-events:none}
.lo-room{position:absolute;z-index:1;font-size:6.5px;letter-spacing:1.4px;color:rgba(0,255,255,.8);text-transform:uppercase;text-shadow:0 0 5px #000,0 0 5px #000;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.w{position:absolute;z-index:5;width:0;height:0;cursor:pointer;transition:left 2.6s linear,top 2.6s linear}
.w-body{position:absolute;left:-15px;top:-34px;width:30px;display:flex;flex-direction:column;align-items:center}
.w-head{width:26px;height:21px;border-radius:12px 12px 8px 8px;background:radial-gradient(circle at 35% 25%,#3a3a52,#0a0a14 70%);border:1.5px solid var(--ac,#9d7cff);position:relative;box-shadow:0 0 9px var(--ac,#9d7cff),inset 0 0 4px rgba(255,255,255,.12);overflow:visible}
.w-head::before{content:'';position:absolute;top:-3px;left:50%;width:5px;height:3px;margin-left:-2.5px;border-radius:2px 2px 0 0;background:var(--em,var(--ac,#9d7cff));box-shadow:0 0 6px var(--em,var(--ac,#9d7cff))}
.w-eyes{position:absolute;top:7px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.w-eye{display:block;width:7px;height:8px;border-radius:50%;background:var(--eye,#7fe9ff);box-shadow:0 0 6px var(--eye,#7fe9ff),0 0 2px #fff inset;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.w[data-st="idle"]:not(.walk) .w-eyes{animation:drift 7s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes drift{0%,40%,100%{transform:translateX(0)}50%,70%{transform:translateX(-2px)}80%,90%{transform:translateX(2px)}}
.w[data-st="down"] .w-eye{animation:none;opacity:.25;transform:scaleY(.2)}
.w-torso{width:18px;height:11px;border-radius:5px 5px 3px 3px;margin-top:-1px;background:linear-gradient(180deg,#1b1b2c,#07070d);border:1.5px solid var(--ac,#9d7cff);position:relative;box-shadow:0 0 6px var(--ac,#9d7cff)}
.w-torso::after{content:'';position:absolute;left:50%;top:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--core,var(--ac,#9d7cff));box-shadow:0 0 6px var(--core,var(--ac,#9d7cff));animation:corepulse 2.4s ease-in-out infinite}
@keyframes corepulse{0%,100%{opacity:.75}50%{opacity:1}}
.w-arms{position:absolute;top:22px;left:-3px;right:-3px;height:8px;pointer-events:none}
.w-arms i{position:absolute;top:0;width:4px;height:9px;border-radius:2px;background:#0c0c18;border:1px solid var(--ac,#9d7cff)}
.w-arms i:first-child{left:0}.w-arms i:last-child{right:0}
.w-legs{display:flex;gap:3px}
.w-legs i{display:block;width:5px;height:6px;border-radius:0 0 2px 2px;background:#0c0c18;border:1px solid var(--ac,#9d7cff);border-top:none}
.w.walk .w-legs i:nth-child(1){animation:step .32s ease-in-out infinite}
.w.walk .w-legs i:nth-child(2){animation:step .32s ease-in-out infinite .16s}
.w.walk .w-body{animation:bob .32s ease-in-out infinite}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.w.work .w-arms i:first-child{animation:tapL .42s ease-in-out infinite}
.w.work .w-arms i:last-child{animation:tapR .42s ease-in-out infinite .21s}
@keyframes tapL{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes tapR{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.w.wings .w-body::before,.w.wings .w-body::after{content:'';position:absolute;top:8px;width:12px;height:16px;background:linear-gradient(135deg,#22ff7a,#047a3a);opacity:.85;box-shadow:0 0 9px #22ff7a;z-index:-1}
.w.wings .w-body::before{left:-11px;border-radius:12px 2px 12px 2px;transform:rotate(-12deg)}
.w.wings .w-body::after{right:-11px;border-radius:2px 12px 2px 12px;transform:rotate(12deg)}
.w.cloak .w-torso{width:22px;border-radius:3px 3px 7px 7px;margin-top:-1px}
.w.og .w-head::before{background:#d4af37;box-shadow:0 0 6px #d4af37;width:7px;margin-left:-3.5px}
.w-dot{position:absolute;left:10px;top:-38px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:#8a86a8}
.w[data-st="working"] .w-dot{background:#4ade80;box-shadow:0 0 9px #4ade80}
.w[data-st="waiting"] .w-dot{background:#f0d88c;box-shadow:0 0 9px #f0d88c}
.w[data-st="down"] .w-dot{background:#f87171;box-shadow:0 0 9px #f87171}
.w[data-st="down"] .w-body{opacity:.45;filter:grayscale(.7)}
.w-name{position:absolute;left:0;top:4px;transform:translateX(-50%);font-size:7px;font-weight:700;color:#fff;background:rgba(5,5,12,.78);border:1px solid rgba(0,255,255,.35);border-radius:5px;padding:1px 4px;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.w-say{position:absolute;left:0;bottom:36px;transform:translateX(-50%);z-index:9;font-size:7.5px;color:#0b0b16;background:#e6fbff;border-radius:8px;padding:2px 6px;white-space:nowrap;box-shadow:0 0 8px rgba(0,255,255,.6);display:none;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.w.talk .w-say{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.lo-note{font-size:9px;color:#8a86a8;margin:6px 2px 0;line-height:1.35}
.lo-feed{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.lo-feed div{font-size:11px;color:#cfc8e8;background:rgba(8,8,20,.8);border:1px solid rgba(138,43,226,.35);border-radius:8px;padding:5px 8px}
.d-dell{display:inline-block;font-size:9.5px;border:1px solid #8a86a8;color:#b9b3d0;border-radius:999px;padding:2px 7px;margin-top:5px}
/* ---------- v9.1: stale light, partner styling, gold approval console, phone layout ---------- */
.w[data-st="stale"] .w-dot{background:#fb923c;box-shadow:0 0 9px #fb923c}
.w[data-st="stale"] .w-body{opacity:.85}
.d-light.stale{background:#fb923c;box-shadow:0 0 9px #fb923c}
.w.partner .w-head{border-color:#d4af37;box-shadow:0 0 11px rgba(212,175,55,.9)}
.w.partner .w-name{border-color:rgba(212,175,55,.85);color:#f5d88c}
.lo-console{position:absolute;z-index:3;transform:translate(-50%,-50%);width:30px;height:22px;cursor:pointer;background:linear-gradient(180deg,#1c1608,#0a0805);border:1.5px solid #d4af37;border-radius:4px;box-shadow:0 0 10px rgba(212,175,55,.45)}
.lo-console::after{content:'';position:absolute;left:3px;right:3px;top:5px;height:4px;border-radius:2px;background:#d4af37;opacity:.9;box-shadow:0 0 6px #d4af37}
.lo-console.pend{animation:goldpulse 1.5s ease-in-out infinite}
@keyframes goldpulse{0%,100%{box-shadow:0 0 6px rgba(212,175,55,.4)}50%{box-shadow:0 0 20px rgba(212,175,55,.95)}}
.ov-alerts{margin:2px 0 8px}
.ov-alert{background:rgba(8,8,20,.85);border:1px solid rgba(212,175,55,.55);border-radius:10px;padding:8px 10px;margin-bottom:5px;cursor:pointer;font-size:12.5px;color:#f5d88c}
.ov-alert .s{color:#cfc8e8;font-size:11.5px}
.ov-team{display:none;flex-direction:column;gap:6px;margin:0 0 10px}
.ov-team .trow{display:flex;align-items:center;gap:9px;background:rgba(8,8,20,.8);border:1px solid rgba(138,43,226,.3);border-radius:10px;padding:7px 10px;cursor:pointer}
.ov-team .trow .tn{font-size:12.5px;color:var(--text);font-weight:600;flex:none}
.ov-team .trow .tt{font-size:11.5px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asof{font-size:11.5px;color:#8a86a8;margin:2px 0 8px}
@media(max-width:430px){
  .ov-team{display:flex}
  .lo-room{font-size:11px;letter-spacing:1px}
  .w-name{font-size:11px}
  .floor-legend{font-size:11px;gap:8px;flex-wrap:wrap}
  .lo-note{font-size:11px}
  .lo-feed div{font-size:11px}
}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(7,7,20,.95);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;box-shadow:0 0 8px var(--green)}
.dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--purple);color:var(--text);border-radius:12px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw}
.toast.show{opacity:1}
/* DRAWER */
#drawer{position:fixed;inset:0;background:rgba(4,4,12,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:86vh;overflow-y:auto;padding:calc(18px + env(safe-area-inset-bottom)) 18px 26px;position:relative}
.sheet h3{font-size:17px;font-weight:700;padding-right:40px}
.close{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:32px;height:32px;font-size:15px;cursor:pointer}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.desc{font-size:13.5px;color:var(--dim);line-height:1.5;margin:8px 0}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);outline:none;margin-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.abtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer}
.abtn.primary{border-color:var(--purple);color:var(--purple)}
.abtn.green{border-color:var(--green);color:var(--green)}
.abtn.gold{border-color:var(--gold);color:var(--gold)}
.abtn.danger{border-color:var(--red);color:var(--red)}
.log{margin-top:14px}
.log h4{font-size:11px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.le{font-size:12.5px;color:var(--text);line-height:1.5;padding:6px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div id="login">
  <div class="logo">V</div>
  <h1>VANTRA <span>Mission Control</span></h1>
  <p>Executive Operations</p>
  <input id="pin" type="password" placeholder="PIN" autocomplete="off" inputmode="numeric">
  <button id="loginBtn">UNLOCK</button>
  <div id="loginErr"></div>
</div>

<div id="shell" class="hidden">
<header>
  <div class="brand">VANTRA <em>MISSION CONTROL</em></div>
  <div class="hbtns">
    <button class="hbtn on" id="vHome">Home</button>
    <button class="hbtn" id="vBoard">Board</button>
    <button class="hbtn" id="vOffice">Office / HQ</button>
    <button class="hbtn" id="vStatus">Status</button>
    <button class="hbtn" id="vAgents">Agents</button>
    <button class="hbtn warn" id="vLogout">Log out</button>
  </div>
</header>
<nav class="tabs" id="filters">

<script>
const APIURL = "https://base44.app/api/apps/6a9224f8c29c628aa348d1ac/functions/missionControlApi";
const COMMSURL = "https://base44.app/api/apps/6a9224f8c29c628aa348d1ac/functions/mcComms";
let token = localStorage.getItem('mc_token') || '';
let board = null; let view='home'; let filter='all'; let selected=null;
let loginBusy=false; let capBusy=false;
const $ = id => document.getElementById(id);

function deviceId(){
  let d = localStorage.getItem('mc_device');
  if(!d){
    d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('mc_device', d);
  }
  return d;
}
function devLabel(){const ua=navigator.userAgent;if(/iPhone|Android.*Mobile/i.test(ua))return 'phone';if(/iPad|Tablet/i.test(ua))return 'tablet';if(/Windows/i.test(ua))return 'windows-pc';if(/Macintosh/i.test(ua))return 'mac';return 'browser';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d.getTime()))return '—';return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function fmtET(iso){try{return new Date(iso).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return iso;}}
function fmtAgentName(str){if(!str) return '';var s=String(str);if(s==='CHATGPT (Manager)'||s==='CHATGPT') return 'OG VANTRA (ChatGPT)';s=s.replace(/CHATGPT\s*\(Manager\)/gi,'OG VANTRA (ChatGPT)');s=s.replace(/\bCHATGPT\b/g,'OG VANTRA (ChatGPT)');return s;}
const PRIO_CLASS={urgent:'p-urgent',high:'p-high',normal:'p-normal',low:'p-low'};
function prioClass(p){return PRIO_CLASS[p]||'p-normal';}
function stateColor(s){return s==='COMPLETED'?'var(--green)':s==='BLOCKED'?'var(--red)':s==='REVIEW'?'var(--amber)':s==='ACTIVE'?'#6ee7a0':s==='WAITING'?'var(--gold)':'var(--purple)';}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function showLogin(){$('login').classList.remove('hidden');$('shell').classList.add('hidden');}
function showShell(){$('login').classList.add('hidden');$('shell').classList.remove('hidden');}
function nowTime(){return new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
let syncConsecutiveFailures=0;
function setDot(err,customMsg){const d=$('dot');if(err){d.className='dot err';$('sync').textContent=customMsg||('sync error '+nowTime());}else{syncConsecutiveFailures=0;d.className='dot';$('sync').textContent='synced '+nowTime();}}

async function api(op, extra, retriesLeft){
  if(typeof retriesLeft!=='number') retriesLeft=2;
  try{
    const res = await fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(Object.assign({op:op},extra||{}))});
    let d=null;
    try{ d=await res.json(); }catch(e){
      if(retriesLeft>0 && res.status>=500){ await new Promise(r=>setTimeout(r,1000)); return await api(op,extra,retriesLeft-1); }
      throw new Error('Server error — no JSON response ('+res.status+')');
    }
    if(!d.ok && res.status===401){localStorage.removeItem('mc_token');token='';showLogin();throw new Error('auth');}
    if(!d.ok){
      if(retriesLeft>0 && res.status>=500){ await new Promise(r=>setTimeout(r,1000)); return await api(op,extra,retriesLeft-1); }
      throw new Error(d.error||('op failed ('+res.status+')'));
    }
    return d;
  }catch(err){
    if(err.message==='auth') throw err;
    if(retriesLeft>0 && (err.name==='TypeError'||String(err.message).indexOf('fetch')>=0)){ await new Promise(r=>setTimeout(r,1200)); return await api(op,extra,retriesLeft-1); }
    throw err;
  }
}

/* ---------- login (P1-2) ---------- */
async function login(){
  if(loginBusy) return;
  const pin=$('pin').value.trim();
  $('loginErr').textContent='';
  if(!pin){ $('loginErr').textContent='Enter your PIN'; return; }
  loginBusy=true; const b=$('loginBtn'); b.disabled=true; b.textContent='CHECKING…';
  try{
    const res=await fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'login',pin:pin,deviceLabel:devLabel(),deviceId:deviceId()})});
    let d=null; let jsonOk=true;
    try{ d=await res.json(); }catch(e){ jsonOk=false; }
    if(!jsonOk){ $('loginErr').textContent='Server error — try again'; $('pin').value=''; return; }
    if(!d.ok){
      if(res.status===401){ $('loginErr').textContent='Wrong PIN'; }
      else if(res.status===429){ $('loginErr').textContent=(d.error||'Locked') + (d.lockUntil ? (' until ' + fmtET(d.lockUntil) + ' ET') : ''); }
      else if(res.status>=500){ $('loginErr').textContent='Server error — try again'; }
      else { $('loginErr').textContent=d.error||'Login failed'; }
      $('pin').value='';
      return;
    }
    token=d.token; localStorage.setItem('mc_token',token);
    $('pin').value='';
    showShell(); refresh();
  }catch(e){
    $('loginErr').textContent='Can\u2019t reach Mission Control — check your connection';
    $('pin').value='';
  }finally{
    loginBusy=false; b.disabled=false; b.textContent='UNLOCK';
  }
}

async function doLogout(){
  try{ await api('logout'); }catch(e){ /* end the session locally even if the call fails */ }
  localStorage.removeItem('mc_token'); token='';
  $('loginErr').textContent='Logged out';
  showLogin();
}

/* ---------- data ---------- */
async function refresh(){
  try{
    board=await api('board');
    setDot(false);
    $('whoami').textContent='BOSS · '+devLabel();
    renderStats(); renderApprovals(); renderTasks(); renderBoard();
    if(view==='office') renderOfficeView();
  }catch(e){
    if(String(e.message)!=='auth'){
      syncConsecutiveFailures++;
      if(syncConsecutiveFailures>=2){ setDot(true,'sync error '+nowTime()); toast('Sync failed — retrying on re-connect'); }
      else{ setDot(true,'reconnecting…'); }
    }
  }
}

    (()=>{
      const dead=a.relatedTaskId&&board&&board.tasks?board.tasks.find(t=>t.taskId===a.relatedTaskId&&(t.state==='CANCELLED'||t.state==='COMPLETED')):null;
      if(dead) return '<div class="acts"><span class="pill p-normal" style="border-color:var(--dim);color:var(--dim)">TASK '+esc(dead.state)+' — nothing to approve</span>'+
        '<button class="abtn" data-act="expireApproval" data-id="'+esc(a.id)+'">Clear</button></div>';
      return '<div class="acts">'+
      '<button class="abtn gold" data-act="decide" data-id="'+esc(a.id)+'" data-decision="approve">Approve</button>'+
      '<button class="abtn danger" data-act="decide" data-id="'+esc(a.id)+'" data-decision="deny">Deny</button>'+
      (a.relatedTaskId ? '<button class="abtn" data-act="open" data-id="'+esc(a.relatedTaskId)+'">Task</button>' : '<button class="abtn" data-act="openIdea" data-id="'+esc(a.id)+'">Details</button>')+

function taskCard(t){
  return '<div class="card" data-act="open" data-id="'+esc(t.taskId)+'">'+
    '<div class="t">'+esc(t.title)+'</div>'+
    '<div class="m">'+
    '<span class="pill '+prioClass(t.priority)+'">'+esc(String(t.priority||'normal').toUpperCase())+'</span>'+
    '<span class="pill" style="border:1px solid '+stateColor(t.state)+';color:'+stateColor(t.state)+'">'+esc(t.state)+'</span>'+
    (t.requiresApproval==='yes'?'<span class="pill p-app">APPROVAL</span>':'')+
    (t.assignedAgent?'<span>· '+esc(fmtAgentName(t.assignedAgent))+'</span>':'')+
    (t.project?'<span>· '+esc(t.project)+'</span>':'')+
    '</div></div>';
}
function renderTasks(){
  let ts=board.tasks;
  if(filter==='all') ts=ts.filter(t=>t.state!=='CANCELLED'); // P1-1: All includes Done now
  else ts=ts.filter(t=>t.state===filter);
  $('listTitle').textContent=filter==='all'?'All Tasks':filter;
  $('tasks').innerHTML=ts.length?ts.map(taskCard).join(''):'<div style="color:var(--dim);font-size:13px;padding:8px 4px">No tasks here. Capture one above.</div>';
}
const COLS=['BACKLOG','READY','ACTIVE','WAITING','BLOCKED','REVIEW','COMPLETED'];
function renderBoard(){
  const cols=filter==='all'?COLS:COLS.filter(c=>c===filter);
  $('board').innerHTML=cols.map(c=>{
    const ts=board.tasks.filter(t=>t.state===c);
    return '<div class="col"><h3>'+c+'<i>'+ts.length+'</i></h3>'+(ts.map(taskCard).join('')||'<div style="color:var(--dim);font-size:12px">—</div>')+'</div>';
  }).join('');
}

var STALE_MS=24*3600*1000; // v9: no check-in for 24h = stale
function agentDeskStatus(r, st, tasks){
  const truth=String(r.operationalTruth||'');
  const mine=tasks.filter(t=>normAgent(t.assignedAgent)===normAgent(r.name));
  let s='idle';
  // v9 truth rules: only a real ACTIVE board task means Working. No guessing from online/busy.
  if(mine.some(t=>t.state==='ACTIVE')) s='working';
  else if(mine.some(t=>t.state==='WAITING')) s='waiting';
  else if(mine.some(t=>t.state==='BLOCKED')) s='down';
  else if(/BLOCKED|NOT VERIFIED|OVERLOADED|FAIL/i.test(truth)) s='down';
  else if(st&&st.status==='error') s='down';
  else {
    const hb=st&&st.lastHeartbeat?new Date(st.lastHeartbeat).getTime():0;
    if(!hb||Date.now()-hb>STALE_MS) s='stale'; // v9: hasn't checked in recently
  }
  return s;
}
const STATUS_LABEL={working:'Working',waiting:'Waiting',idle:'Idle',down:'Down',stale:'Stale'};
function deskHtml(r, tasks, agents){
  const look=agentLook(r.name);
  const st=(agents||[]).find(a=>normAgent(a.agentName)===normAgent(r.name));
  const status=agentDeskStatus(r, st, tasks);
  const mine=tasks.filter(t=>normAgent(t.assignedAgent)===normAgent(r.name));
  const active=mine.find(t=>t.state==='ACTIVE');
  const isClaw=normAgent(r.name).indexOf('CLAW')>=0&&normAgent(r.name).indexOf('LENOCLAW')<0;
  const role=(r.roleTitle||'').trim();
  return '<div class="desk" data-act="desk" data-agent="'+esc(r.name)+'" data-st="'+status+'">'
   +'<div class="desk-top">'
   +'<span class="d-avatar" style="background:'+look.bg+'">'+look.i+'</span>'
   +'<span class="d-light '+status+'"></span>'
   +'</div>'
   +'<div class="d-name">'+esc(fmtAgentName(r.name))+'</div>'
   +(role?'<div class="d-role">'+esc(role)+'</div>':'')
   +'<div class="d-bubble">'+(active?('🖥 '+esc(active.title)):'<span style="color:#8a86a8">No active task</span>')+'</div>'
   +(isClaw&&status==='idle'?'<span class="d-dell">Dell closed</span>':'')
   +'</div>';
}

function loLook(name){
  var n=normAgent(name); var keys=Object.keys(LO_LOOKS).sort(function(a,b){return b.length-a.length;});
  for(var k=0;k<keys.length;k++){ if(n.indexOf(keys[k])>=0) return LO_LOOKS[keys[k]]; }

}

function loKey(name){
  var n=normAgent(name);
  var keys=Object.keys(LO_HOME).sort(function(a,b){return b.length-a.length;});
  for(var k=0;k<keys.length;k++){ if(n.indexOf(keys[k])>=0) return keys[k]; }

}
function loFirst(name){ return fmtAgentName(name).replace(/^VANTRA\s+/i,'').replace(/\s+GROK$/i,'').replace(/\s*\(.*\)/,''); }
function loPlace(el,pt){ el.style.left=pt.x+'%'; el.style.top=pt.y+'%'; }
function loTick(){
  var ids=Object.keys(LO_ALL); if(!ids.length) return;
  LO_TICKS++;
  if(LO_TICKS%14===0) loLoadComms();
  ids.forEach(function(id){
    var rec=LO_ALL[id]; if(!rec||!rec.el||!rec.el.isConnected) return;
    if(rec.status==='working'){ rec.el.classList.remove('walk'); rec.el.classList.add('work'); loPlace(rec.el,rec.home); return; }
    rec.el.classList.remove('work');
    if(rec.status==='down'){
      var pt=rec.bay||rec.home; // CLAW/HERMES/LENOCLAW keep their home station as their bay (v9)
      if(!rec.atDown){ rec.el.classList.add('walk'); loPlace(rec.el,pt); rec.atDown=true; setTimeout(function(){ rec.el.classList.remove('walk'); },2800); }
      return;
    }
    rec.atDown=false;
    if(rec.status==='waiting'){
      if(!rec.atWait){ rec.el.classList.add('walk'); loPlace(rec.el,rec.waitSpot); rec.atWait=true; setTimeout(function(){ rec.el.classList.remove('walk'); },2800); }
      return;
    }
    rec.atWait=false;
    // idle or stale: stands at their station. v9: no wandering, no bubbles, no fake activity.
    rec.el.classList.remove('walk'); loPlace(rec.el,rec.home);
  });
}

      '<div class="stat"><div style="color:#22c55e">'+tally.working+'</div>Working</div>'
      +'<div class="stat"><div style="color:#eab308">'+tally.waiting+'</div>Waiting</div>'
      +'<div class="stat"><div style="color:#ef4444">'+tally.down+'</div>Down</div>'
      +'<div class="stat"><div style="color:#8a86a8">'+tally.idle+'</div>Idle</div>'
      +'<div class="stat"><div style="color:#fb923c">'+tally.stale+'</div>Stale</div>';
    box.innerHTML='<div class="asof">Data as of '+fmtET(new Date().toISOString())+' ET \u00b7 Working only shows with an ACTIVE board task \u00b7 Stale = no check-in for 24 h</div>'+(cards||'<div class="errline">No roster data.</div>');
  }catch(e){
    box.innerHTML='<div class="errline">Can\u2019t load team status: '+esc(e.message)+' <button class="abtn" style="margin-top:6px;font-size:11px" data-act="retryStatus">Retry</button></div>';
  }
}

/* ---------- task drawer ---------- */
async function openTask(taskId, ideaApprovalObj){
  if(!taskId && ideaApprovalObj){ renderIdeaApprovalSheet(ideaApprovalObj); return; }
  try{
    const d=await api('task',{taskId:taskId});
    selected=d.task;
    const t=selected;
    const aps=d.approvals||[];
    let acts='';
    if(t.state==='BACKLOG') acts+='<button class="abtn primary" data-act="move" data-to="READY" data-reason="ready">→ Ready</button>';
    if(t.state==='READY') acts+='<button class="abtn primary" data-act="move" data-to="ACTIVE" data-reason="started by Boss">Start</button><button class="abtn gold" data-act="move" data-to="WAITING" data-reason="waiting on input">Wait</button>';
    if(t.state==='ACTIVE') acts+='<button class="abtn gold" data-act="move" data-to="WAITING" data-reason="waiting on input">Wait</button><button class="abtn" data-act="move" data-to="BLOCKED" data-reason="blocked by Boss">Block</button><button class="abtn" data-act="move" data-to="REVIEW" data-reason="ready for review">→ Review</button>';
    if(t.state==='BLOCKED'||t.state==='WAITING') acts+='<button class="abtn green" data-act="move" data-to="ACTIVE" data-reason="unblocked by Boss">Unblock</button>';
    if(t.state==='REVIEW') acts+='<button class="abtn gold" data-act="complete">Complete ✓</button>';
    if(t.state!=='COMPLETED'&&t.state!=='CANCELLED') acts+='<button class="abtn danger" data-act="move" data-to="CANCELLED" data-reason="cancelled by Boss">Cancel</button>';
    const log=(t.activityLog||[]).map(e=>'<div class="le"><b>'+esc(e.actor)+'</b> · '+esc(e.kind)+' · '+esc(String(e.text||'').substring(0,160))+'<div style="color:var(--dim);font-size:10.5px">'+fmtDate(e.at)+'</div></div>').join('');
    const hist=(t.stateHistory||[]).map(h=>'<div class="le" style="font-size:11.5px">'+esc(h.from||'(new)')+' → <b>'+esc(h.to)+'</b> by '+esc(h.actor)+' · '+fmtDate(h.at)+'</div>').join('');
    $('sheet').innerHTML=
      '<button class="close" data-act="close">✕</button>'+
      '<h3>'+esc(t.title)+'</h3>'+
      '<div class="meta">'+
      '<span class="pill" style="border:1px solid '+stateColor(t.state)+';color:'+stateColor(t.state)+'">'+esc(t.state)+'</span>'+
      '<span class="pill '+prioClass(t.priority)+'">'+esc(String(t.priority||'normal').toUpperCase())+'</span>'+
      (t.requiresApproval==='yes'?'<span class="pill p-app">APPROVAL REQUIRED</span>':'')+
      '<span class="pill p-normal">'+esc(t.createdBy)+'</span>'+
      (t.assignedAgent?'<span class="pill p-normal">→ '+esc(t.assignedAgent)+'</span>':'')+
      '</div>'+
      (t.description?'<div class="desc">'+esc(t.description)+'</div>':'')+
      (t.errorSummary?'<div class="desc" style="color:var(--red)">⚠ '+esc(t.errorSummary)+'</div>':'')+
      (aps.length?'<div class="sec"><h2>Approvals</h2>'+aps.map(a=>'<div class="le">Approval: <b>'+esc(a.status)+'</b> · '+fmtDate(a.decidedAt||a.requestedAt)+'</div>').join('')+'</div>':'')+
      '<input id="noteIn" placeholder="Add note…"><button class="abtn" style="margin-top:8px" data-act="note">Post Note</button>'+
      (t.state==='READY'?'<input id="assignIn" placeholder="Assign to agent (optional — filled in on Start)">':'')+
      '<div class="acts">'+acts+'</div>'+
      '<div class="log"><h4>Activity</h4>'+(log||'<div class="le">No activity yet.</div>')+'</div>'+
      '<div class="log"><h4>State History</h4>'+(hist||'<div class="le">No history yet.</div>')+'</div>';
    $('drawer').classList.remove('hidden');
  }catch(e){toast(e.message);}
}
function closeDrawer(){$('drawer').classList.add('hidden');}
async function move(to,reason){
  try{
    if(to==='ACTIVE'){
      const a=$('assignIn');
      if(a && a.value.trim()){ try{ await api('updateTask',{taskId:selected.taskId,assignedAgent:a.value.trim()}); }catch(e){ } }
    }
    await api('moveTask',{taskId:selected.taskId,to:to,reason:reason});
    toast('→ '+to);
    refresh();
    openTask(selected.taskId); // P2-1: drawer stays open so the new status is visible
  }catch(e){toast(e.message);}
}
async function complete(){
  try{
    await api('complete',{taskId:selected.taskId,verified:true,note:'Boss verified from client'});
    toast('Completed ✓');
    refresh();
    openTask(selected.taskId);
  }catch(e){toast(e.message);}
}
async function addNote(){
  const v=$('noteIn').value.trim();
  if(!v) return;
  try{ await api('note',{taskId:selected.taskId,text:v}); toast('Note added'); openTask(selected.taskId); }catch(e){toast(e.message);}
}
async function decide(id,decision){
  try{ await api('decideApproval',{approvalId:id,decision:decision,note:'decided from client'}); toast(decision==='approve'?'Approved ✓':'Denied'); refresh(); }catch(e){toast(e.message);}
}
async function createTask(){
  if(capBusy) return; // P2-3: double-tap guard
  const title=$('capIn').value.trim(); if(!title) return;
  capBusy=true; $('capBtn').disabled=true;
  try{
    await api('createTask',{title:title,priority:($('capPriority').value||'normal'),project:$('capProject').value.trim(),requiresApproval:$('capApproval').value,idempotencyKey:('cap-'+Date.now()+'-'+deviceId())});
    $('capIn').value=''; $('capProject').value=''; $('capPriority').value=''; $('capApproval').value='no'; // P2-3: reset selects
    toast('Task captured');
    refresh();
  }catch(e){toast(e.message);}
  finally{ capBusy=false; $('capBtn').disabled=false; }
}

/* ---------- delegated wiring (P0-2: no inline onclick anywhere) ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.getAttribute('data-act');
  if(act==='open') openTask(el.getAttribute('data-id'));
  else if(act==='decide') decide(el.getAttribute('data-id'),el.getAttribute('data-decision'));
  else if(act==='move') move(el.getAttribute('data-to'),el.getAttribute('data-reason'));
  else if(act==='complete') complete();
  else if(act==='note') addNote();
  else if(act==='close') closeDrawer();
  else if(act==='logout') doLogout();
  else if(act==='retry') boot(true);
  else if(act==='retryAgents') renderAgents();
  else if(act==='retryStatus') renderStatus();
  else if(act==='refreshOffice') renderOfficeView();
  else if(act==='officeApprovals'||act==='openApprovalAlert'){ openOfficeApprovals(); }
  else if(act==='openIdea'){
    const app=(board&&board.approvals)?board.approvals.find(a=>a.id===el.getAttribute('data-id')):null;
    renderIdeaApprovalSheet(app||{id:el.getAttribute('data-id'),description:'Idea approval (unlinked)'});
  }
  else if(act==='desk'){ openAgentCard(el.getAttribute('data-agent')); }
  else if(act==='deskAssign'){ openAssignForm(el.getAttribute('data-agent')); }
  else if(act==='deskAssignGo'){ submitAssign(el.getAttribute('data-agent')); }
  else if(act==='expireApproval'){ try{ await api('expireApproval',{approvalId:el.getAttribute('data-id')}); toast('Cleared'); refresh(); }catch(e){ toast(e.message); } }
  else if(act==='deskWait'){ moveTaskToWaiting(el.getAttribute('data-task'),'Moved to WAITING from agent desk card'); }
});
$('loginBtn').addEventListener('click',login);
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('capBtn').addEventListener('click',createTask);
$('capIn').addEventListener('keydown',e=>{if(e.key==='Enter')createTask();});
$('vLogout').addEventListener('click',doLogout);
function setView(v){
  view=v;
  $('home').classList.toggle('hidden',v!=='home');
  $('boardView').classList.toggle('hidden',v!=='board');
  $('officeView').classList.toggle('hidden',v!=='office');
  $('agentsView').classList.toggle('hidden',v!=='agents');
  $('statusView').classList.toggle('hidden',v!=='status');
  $('vStatus').classList.toggle('on',v==='status');
  $('vHome').classList.toggle('on',v==='home');
  $('vBoard').classList.toggle('on',v==='board');
  $('vOffice').classList.toggle('on',v==='office');
  $('vAgents').classList.toggle('on',v==='agents');
  if(v==='agents') renderAgents(); // P2-5: agents fetched only when the view is open
  if(v==='office') renderOfficeView();
  if(v==='status') renderStatus();
}
$('vHome').addEventListener('click',()=>setView('home'));
$('vBoard').addEventListener('click',()=>setView('board'));
$('vOffice').addEventListener('click',()=>setView('office'));
$('vStatus').addEventListener('click',()=>setView('status'));
$('vAgents').addEventListener('click',()=>setView('agents'));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  filter=b.dataset.f;
  if(view==='board') renderBoard(); else renderTasks(); // P1-1: tabs filter the Board too
}));
setInterval(()=>{if(token) refresh();},45000);
window.addEventListener('online',()=>{ if(token) refresh(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && token) refresh(); });
document.addEventListener('visibilitychange',()=>{if(!document.hidden && token) refresh();});

/* ---------- boot (P1-4: real errors, retry) ---------- */
async function boot(isRetry){
  $('loginErr').textContent='';
  if(!token) return;
  $('loginErr').textContent='Connecting…';
  try{
    const res=await fetch(APIURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({op:'board'})});
    if(res.status===401){localStorage.removeItem('mc_token');token='';$('loginErr').textContent='';return;}
    if(!res.ok) throw new Error('server');
    let d=null;
    try{ d=await res.json(); }catch(e){ throw new Error('json'); }
    if(!d || !d.ok) throw new Error('server');
    $('loginErr').textContent='';
    showShell();
    refresh();
  }catch(e){
    $('loginErr').innerHTML='Can\u2019t reach Mission Control. <button class="abtn" data-act="retry">Retry</button>';
  }
}
boot(false);
</script>
