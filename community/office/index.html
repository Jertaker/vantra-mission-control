<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="noindex,nofollow">
<title>VANTRA Hub — Office</title>
<link rel="icon" href="../../favicon.png">
<style>
:root{--bg:#0b0e14;--card:#12161f;--card2:#161b26;--line:#232a38;--gold:#d4af37;--gold2:#f0d078;--txt:#e8e4d8;--dim:#8b93a5;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:10px;padding:18px 16px 8px;max-width:560px;margin:0 auto}
.emblem{width:38px;height:38px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 14px rgba(212,175,55,.45)}
h1{font-size:18px}.sub{font-size:12px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin:0 0 12px;font-weight:700}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold),#b8932c);color:#14100a;font-weight:700;border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
label{font-size:12px;color:var(--dim);display:block;margin:2px 0 4px}
.small{font-size:12.5px;color:var(--dim);line-height:1.5}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;background:#1d2432;border:1px solid var(--gold);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:90vw}
.gate{max-width:340px;margin:22vh auto 0;text-align:center}
</style>
</head>
<body>
<header>
  <img class="emblem" src="../jg_emblem.png" alt="JG emblem">
  <div><h1>Hub Office</h1><div class="sub">Team control panel — VANTRA Community Hub</div></div>
</header>
<main id="view"></main>
<script>
const API="https://base44.app/api/apps/6a9224f8c29c628aa348d1ac/functions/communityApi";
let adminTok=localStorage.getItem("vh_admin")||"";
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
async function api(op,data={},tok){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify({op,...data})});return await r.json()}catch(e){return{ok:false,error:"Network hiccup. Try again."}}}
function render(){const v=$("view");
 if(!adminTok){v.innerHTML=`<div class="card gate">
  <div class="h2">PIN</div>
  <input id="ad_pin" type="password" inputmode="numeric" maxlength="12" placeholder="••••" style="text-align:center;letter-spacing:6px;font-size:20px">
  <button class="btn" style="width:100%" onclick="adLogin()">Unlock</button>
  <p class="small" style="margin-top:10px">Team only. Wrong attempts lock this page progressively.</p></div>`;return}
 v.innerHTML=`<div class="card"><div class="h2">Members &amp; access</div><span class="small" id="om_list">Loading…</span></div>
 <div class="card"><div class="h2">Post a deal or offer</div>
  <label>Title</label><input id="ad_title" maxlength="200">
  <label>Details</label><textarea id="ad_body" maxlength="10000"></textarea>
  <button class="btn" onclick="postDeal()">Post deal</button>
  <div class="small" style="margin-top:8px" id="od_list"></div></div>
 <div class="card"><div class="h2">Courses &amp; assignments</div><span class="small" id="oc_list">Loading…</span></div>
 <div class="card"><div class="h2">Publish a course</div>
  <label>Module</label><input id="ac_mod" placeholder="e.g. LTD / Amway">
  <label>Title</label><input id="ac_title">
  <label>Description</label><input id="ac_desc">
  <label>Video URL (https)</label><input id="ac_vid" placeholder="https://…">
  <label>Resource URL (https)</label><input id="ac_res" placeholder="https://…">
  <label>Minutes</label><input id="ac_min" type="number" value="20">
  <label>Who sees it</label><select id="ac_aud"><option value="">Nobody yet — I'll assign it</option><option value="customer">Customers only</option><option value="team">Team only</option></select>
  <button class="btn" onclick="adDo('createCourse',{module:$('ac_mod').value,title:$('ac_title').value,description:$('ac_desc').value,videoUrl:$('ac_vid').value,resourceUrl:$('ac_res').value,durationMin:parseInt($('ac_min').value),audience:$('ac_aud').value},'Course published')">Publish</button></div>
 <div class="card"><div class="h2">Create an event</div>
  <label>Title</label><input id="ae_title">
  <label>Starts (your time)</label><input id="ae_start" type="datetime-local">
  <label>Join URL (https)</label><input id="ae_url" placeholder="Leave empty to post link later">
  <label>Host</label><input id="ae_host">
  <button class="btn" onclick="adDo('createEvent',{title:$('ae_title').value,startsAt:new Date($('ae_start').value).toISOString(),joinUrl:$('ae_url').value,host:$('ae_host').value},'Event created')">Create</button></div>
 <div class="card"><div class="h2">Add knowledge source</div>
  <label>Title</label><input id="ak_title">
  <label>Category</label><input id="ak_cat" placeholder="e.g. Community Hub">
  <label>Body</label><textarea id="ak_body"></textarea>
  <label>Source URL (https, optional)</label><input id="ak_url">
  <button class="btn" onclick="adDo('addKnowledge',{title:$('ak_title').value,category:$('ak_cat').value,body:$('ak_body').value,sourceUrl:$('ak_url').value},'Added to approved library')">Add</button></div>
 <div class="card"><div class="h2">Stats</div><span class="small" id="ad_stats">Loading…</span></div>
 <button class="btn sec" onclick="adminTok='';localStorage.removeItem('vh_admin');render()">Log out</button>`;
 api("adminMembers",{},adminTok).then(j=>{if(!j.ok||!$("om_list"))return;const ms=j.members||[];$("om_list").innerHTML=ms.length?ms.map(m=>`<div class="lesson" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>${esc(m.name)}</b><div class="small">${esc(m.email)}</div></div><select style="width:auto" onchange="adDo('setMemberAudience',{id:'${m.id}',audience:this.value},'Access saved')"><option value="member" ${m.audience==="member"||!m.audience?"selected":""}>No access</option><option value="customer" ${m.audience==="customer"?"selected":""}>Customer</option><option value="team" ${m.audience==="team"?"selected":""}>Team</option></select></div>`).join(""):'No one has signed in yet. When someone signs in with their invite, they show up here and you give them Customer access.'});
 api("adminDeals",{},adminTok).then(j=>{if(!j.ok||!$("od_list"))return;const d=j.deals||[];$("od_list").textContent=d.length?"Live deals: "+d.map(x=>x.title).join(" · "):"No deals posted yet."});
 api("adminCourses",{},adminTok).then(j=>{if(!j.ok||!$("oc_list"))return;const cs=j.courses||[];$("oc_list").innerHTML=cs.length?cs.map(c=>`<div class="lesson" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>${esc(c.title)}</b><div class="small">${c.audience==="customer"?"Customers":c.audience==="team"?"Team":"UNASSIGNED — visible to no one"}</div></div><select style="width:auto" onchange="adDo('setCourseAudience',{id:'${c.id}',audience:this.value},'Assignment saved')"><option value="" ${!c.audience?"selected":""}>Nobody</option><option value="customer" ${c.audience==="customer"?"selected":""}>Customers</option><option value="team" ${c.audience==="team"?"selected":""}>Team</option></select></div>`).join(""):'<span class="small">No courses yet. Publish one below — it stays invisible until you assign it.</span>'})
 api("adminStats",{},adminTok).then(j=>{if(!j.ok){adminTok="";localStorage.removeItem("vh_admin");toast(j.error);render();return}$("ad_stats").textContent=Object.entries(j.stats).map(([k,v])=>k+": "+v).join(" · ")})}
async function adLogin(){const pin=$("ad_pin").value.trim();if(!pin)return;const j=await api("adminLogin",{pin,deviceLabel:navigator.userAgent.slice(0,40)});if(j.ok){adminTok=j.token;localStorage.setItem("vh_admin",adminTok);toast("Admin ready");render()}else{$("ad_pin").value="";toast(j.error)}}
async function postDeal(){const t=$("ad_title").value.trim(),b=$("ad_body").value.trim();if(!t||!b)return toast("Title and details, please");await adDo("createDeal",{title:t,body:b},"Deal posted — customers only");render()}
async function adDo(op,data,msg){const j=await api(op,data,adminTok);if(j.ok){toast(msg)}else{toast(j.error);if(j.error&&j.error.includes("Admin session")){adminTok="";localStorage.removeItem("vh_admin");render()}}}
render();
</script>
</body>
</html>
